#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
dir_length = 1
sort_order = ["tmux", "config"]
blacklist = [
  "^aider( |$)",
  "^amazon_q( |$)",
  "^claude( |$)",
  "^cliamp( |$)",
  "^codex( |$)",
  "^copilot( |$)",
  "^crush( |$)",
  "^cursor( |$)",
  "^gemini( |$)",
  "^grok( |$)",
  "^opencode( |$)",
  "^pi( |$)",
  "^qwen( |$)",
]

[[session]]
name = "server/cayde"
startup_command = "ssh cayde"

[[session]]
name = "server/ikora"
startup_command = "ssh ikora"

[[session]]
name = "flux/master"
path = "~/Projects/worktrees/flux/master/"
alias = "fm"

[[session]]
name = "flux/pull-request"
path = "~/Projects/worktrees/flux/pr-review/"
alias = "fpr"

[[session]]
name = "flux/hotfix"
path = "~/Projects/worktrees/flux/hotfix/"
alias = "fhot"

[[session]]
name = "dotfiles"
path = "~/Projects/gugahoi/dotfiles/"
alias = "dot"
